name: Deploy Frontend to AWS S3

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: https://26td8ebahl.execute-api.ap-south-1.amazonaws.com/production
          VITE_AWS_REGION: ap-south-1
          VITE_COGNITO_USER_POOL_ID: ap-south-1_tSD3QRhHF
          VITE_COGNITO_CLIENT_ID: 3lk4227nd255inept6ph616nv0
          VITE_S3_BUCKET: parkshare-images-production-742986823789

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Deploy to S3 Bucket
        run: |
          aws s3 sync dist/ s3://parkshare-frontend-production-742986823789 --delete
